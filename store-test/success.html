<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Crafts by Jon</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-299D45HZTC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-299D45HZTC');
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4f8ff;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 3px solid #1a1a2e;
      border-radius: 16px;
      box-shadow: 6px 6px 0 #1a1a2e;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .check {
      font-size: 4rem;
      margin-bottom: 16px;
      line-height: 1;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #27ae60;
    }

    p {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: #4A90E2;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border: 2px solid #1a1a2e;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 3px 3px 0 #1a1a2e;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 #1a1a2e; }
    .btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #1a1a2e; }


  </style>
</head>
<body>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get('session_id') || '';
      gtag('event', 'purchase', {
        transaction_id: sessionId,
        currency: 'GBP'
      });
    })();
  </script>
  <div class="card">
    <div class="check">✓</div>
    <h1>Payment Successful!</h1>
    <p>Thank you for your order. You'll receive a confirmation email shortly, and your item will be posted within 1–3 business days.</p>
    <a href="/store-test/" class="btn">← Back to Store</a>

  </div>
</body>
</html>
