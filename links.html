<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crafts by Jon - Links</title>
<meta name="description" content="Handmade acrylic bookmarks, keyrings and more from Crafts by Jon, Deal, Kent. Shop and find me elsewhere.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://craftsbyjon.co.uk/links">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Crafts by Jon">
<meta property="og:title" content="Crafts by Jon - Links">
<meta property="og:description" content="Handmade acrylic bookmarks, keyrings and more from Crafts by Jon, Deal, Kent.">
<meta property="og:url" content="https://craftsbyjon.co.uk/links">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:   #4A90E2;
    --yellow: #F5A623;
    --coral:  #FF6B6B;
    --dark:   #1a1a2e;
    --white:  #ffffff;
    --border: 3px solid #1a1a2e;
    --shadow: 5px 5px 0 #1a1a2e;
    --shadow-hover: 8px 8px 0 #1a1a2e;
    --font-head: 'Nunito', sans-serif;
    --font-body: 'Open Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--dark);
    background:var(--white);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 20px 60px;
  }
  .wrap{width:100%;max-width:420px;text-align:center;}
  .logo{
    font-family:var(--font-head);
    font-weight:800;
    font-size:1.9rem;
    margin:0 0 6px;
  }
  .logo span{color:var(--blue);}
  .tagline{
    margin:0 0 32px;
    font-size:0.95rem;
    color:#555;
  }
  .avatar{
    width:96px;height:96px;border-radius:50%;
    border:var(--border);
    background:var(--yellow);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-head);font-weight:800;font-size:1.8rem;
    margin:0 auto 18px;
  }
  .links{display:flex;flex-direction:column;gap:16px;}
  a.link-btn{
    display:block;
    font-family:var(--font-head);
    font-weight:800;
    font-size:1.05rem;
    text-decoration:none;
    padding:16px 20px;
    border:var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  a.link-btn:hover, a.link-btn:active{
    transform:translate(-2px,-2px);
    box-shadow:var(--shadow-hover);
  }
  .btn-yellow{background:var(--yellow);color:var(--dark);}
  .btn-blue{background:var(--blue);color:var(--white);}
  .btn-coral{background:var(--coral);color:var(--white);}
  .btn-white{background:var(--white);color:var(--dark);}
  footer{
    margin-top:36px;
    font-size:0.8rem;
    color:#888;
  }
  footer a{color:#888;}
</style>
</head>
<body>
<div class="wrap">
  <div class="avatar">CBJ</div>
  <h1 class="logo">Crafts by <span>Jon</span></h1>
  <p class="tagline">Handmade acrylic bookmarks, keyrings &amp; more &mdash; Deal, Kent</p>

  <div class="links">
    <a class="link-btn btn-yellow" href="https://craftsbyjon.co.uk/store/">Shop the Store</a>
    <a class="link-btn btn-blue" href="https://craftsbyjon.co.uk/custom-orders.html">Custom Orders</a>
    <a class="link-btn btn-coral" href="https://www.instagram.com/craftsbyjon" target="_blank" rel="noopener">Instagram</a>
    <a class="link-btn btn-white" href="https://www.facebook.com/craftsbyjon" target="_blank" rel="noopener">Facebook</a>
    <a class="link-btn btn-yellow" href="https://www.tiktok.com/@crafts.by.jon" target="_blank" rel="noopener">TikTok</a>
    <a class="link-btn btn-blue" href="https://uk.pinterest.com/CraftsByJon/" target="_blank" rel="noopener">Pinterest</a>
  </div>

  <footer>
    <p>&copy; Crafts by Jon, Deal, Kent &middot; <a href="https://craftsbyjon.co.uk/privacy.html">Privacy</a></p>
  </footer>
</div>
</body>
</html>
