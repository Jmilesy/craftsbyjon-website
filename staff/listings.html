        <div class="img-drop-overlay">📎 Drop images here (multiple OK)</div>
        <div class="field-group-title" style="margin-bottom:10px">Gallery — lifestyle &amp; extra shots <span style="font-weight:400;color:#888;font-size:0.78rem">(shown as thumbnails in the store product view)</span></div>
        <div id="gallery-thumbs" style="display:flex;flex-wrap:wrap;gap:10px">${galleryThumbs || '<span style="color:#999;font-size:0.85rem">No gallery images yet — drag photos here or click to choose</span>'}</div>
      </div>`;

    const persImgUrl = toWebImageUrl(p['personalisation_image_url'] || '');
    const persImageHtml = persImgUrl
      ? `<div class="image-preview" id="pers-img-preview" data-img-drop="personalisation" style="position:relative;margin-top:12px">
           <div class="img-drop-overlay">📎 Drop to replace</div>
           <div class="field-group-title" style="margin-bottom:10px">Personalisation Preview Image</div>
           <img src="${escAttr(persImgUrl)}" alt="Personalisation preview" onerror="this.style.display='none'" />
           <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
             <a href="${escAttr(persImgUrl)}" target="_blank" style="font-size:.8rem;color:var(--teal)">Open full ↗</a>
             <button class="copy-btn" data-copy="${escAttr(persImgUrl)}" onclick="copyField(this)">Copy URL</button>
             <button class="copy-btn" style="background:#c0392b;color:#fff" onclick="clearPersImage()">Remove</button>
           </div>
         </div>`
      : `<div class="image-preview" id="pers-img-preview" data-img-drop="personalisation" style="position:relative;margin-top:12px">
           <div class="img-drop-overlay">📎 Drop personalisation image here</div>
           <div class="no-image" style="font-size:0.85rem;color:#999">Optional: Drop personalised version here</div>
         </div>`;

    const existingPostsHtml = generatedPosts && Object.keys(generatedPosts).length > 0
      ? `<div class="social-results" id="social-results"></div>`
      : `<div class="social-results" id="social-results"></div>`;

    const productId = p['Product ID'] || '';
    const reelGenAt = p['reel_generated_at'] || '';
    const reelLabel = reelGenAt ? '🔄 Regenerate Reel' : '🎬 Generate Reel';
    const reelStatus = reelGenAt ? `<div class="reel-stamp">Last generated: ${reelGenAt}</div>` : '';

    document.getElementById('product-card').innerHTML = `
      <div class="card-header">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div class="product-id-badge">ID: ${escHtml(p['Product ID']||'—')}</div>
          <a href="https://craftsbyjon.co.uk/store/?preview=${encodeURIComponent(productId)}" target="_blank" rel="noopener"
             style="background:rgba(255,255,255,0.2);color:#fff;font-size:.75rem;padding:4px 10px;border-radius:20px;text-decoration:none;font-weight:500;white-space:nowrap">
             👁 Preview
          </a>
        </div>
        <div class="card-title">${escHtml(p['Title']||'Untitled Product')}</div>
      </div>

      <div class="status-flags">${STATUS_COLS.map(flagHtml).join('')}</div>

      <div class="fields">
        <div class="field-group">
          <div class="field-group-title">Core Listing Fields</div>
          ${fieldRow('Product ID',        p['Product ID'],         null,                  false)}
          ${fieldRow('Title',             p['Title'],              'Title',               true)}
          ${fieldRow('Short Description', p['Short Description'],  'Short Description',   true)}
          ${fieldRow('Full Description',  p['Full Description'],   'Full Description',    true)}
          <div class="field-row" id="row-regenerate-listing">
            <div class="field-label"></div>
            <div class="field-value"></div>
            <div class="field-copy">
              <button class="field-edit-btn" id="regen-listing-btn" onclick="regenerateListing()">🔄 Regenerate Listing</button>
            </div>
          </div>
          <div id="regen-listing-status" style="font-size:.8rem;margin-top:-6px;margin-bottom:8px"></div>
        </div>
        <div class="field-group">
          <div class="field-group-title">Bullet Points</div>
          ${bulletRows}
        </div>
        <div class="field-group">
          <div class="field-group-title">Production Details</div>
          ${fieldDropdown('Product Type', p['product_type'] || '', 'product_type', ['', 'Bookmark', 'Keyring', 'Sticker', 'Mug', 'Tote Bag', 'T-Shirt', 'Print', 'Mouse Mat', 'Coaster Set', 'Fridge Magnet'])}
          ${fieldDropdown('Material', p['material'] || p['Material'], 'material', ['Acrylic', 'Sticker Sheet', 'Cotton', 'Cotton Canvas', 'Ceramic', 'Neoprene'])}
          ${fieldDropdown('Application Method', p['application_method'] || p['Application Method'], 'application_method', ['UV DTF', 'Cut Vinyl', 'UV DTF + Cut Vinyl', 'Print on Demand (Gelato)', 'Print on Demand (Papello)'])}
          ${fieldDropdown('Original Design', p['original_design'] || p['Original Design'], 'original_design', ['Yes', 'No'])}
          <div class="field-row" id="row-personalised">
            <div class="field-label">Personalised available</div>
            <div class="field-value" id="val-personalised">${p.personalised === 1 ? 'Yes (+£1.50)' : 'No'}</div>
            <div class="field-copy">
              <button class="field-edit-btn" onclick="startEditPersonalised()">Edit</button>
            </div>
          </div>
          ${p.personalised === 1 ? `<div class="field-row" id="row-personalisationnote">
            <div class="field-label">Personalisation note</div>
            <div class="field-value${!p.personalisation_note ? ' empty' : ''}" id="val-personalisationnote">${p.personalisation_note ? escHtml(p.personalisation_note) : '(empty)'}</div>
            <div class="field-copy">
              <button class="copy-btn" data-copy="${escAttr(p.personalisation_note || '')}" onclick="copyField(this)"${!p.personalisation_note ? ' disabled' : ''}>Copy</button>
              <button class="field-edit-btn" onclick="startEdit('personalisation_note')">Edit</button>
            </div>
          </div>` : ''}
          ${fieldDropdown('Collection', p['Collection'] || '', 'Collection', ['', ...collectionsOptions])}
          <div class="field-row" id="row-price">
            <div class="field-label">Price</div>
            <div class="field-value" id="val-price">£${parseFloat(p.price || 3.50).toFixed(2)}</div>
            <div class="field-copy">
              <button class="field-edit-btn" onclick="startEditPrice()">Edit</button>
            </div>
          </div>
        </div>
        ${renderVariantsPanel(p)}
        ${renderVariantImagesPanel(p)}
        ${renderMugPanel(p)}
        ${renderPodGalleryPanel(p)}
        <div class="field-group">
          <div class="field-group-title">Search Tags</div>
          ${fieldRow('Search Tags', p['Search Tags'])}
        </div>
      </div>

      ${imageHtml}
      ${galleryHtml}
      ${persImageHtml}
      <input type="hidden" id="pers-imgurl-input" value="${escAttr(p['personalisation_image_url'] || '')}" />

      <div class="social-panel">
        <div class="social-header">
          🐝 Generate Social Posts
          <em>Powered by Groq AI</em>
        </div>
        <div class="social-body">
          ${!readyToGo ? `<div class="social-not-ready">⚠ Set "Ready to Go" to Yes before generating posts</div>` : ''}
          ${!hasImage ? `<div class="social-not-ready" style="color:#b45309">⚠ No image set — Instagram button will be disabled</div>` : ''}
          <button class="social-generate-btn" id="social-gen-btn"
            onclick="generateSocialPosts()"
            ${readyToGo ? '' : 'disabled'}>
            <span class="btn-spinner"></span>
            <span class="btn-label">${hasPosts ? '🔄 Regenerate Posts' : '🐝 Generate Social Posts'}</span>
          </button>
          <div id="social-gen-status" class="madebyme-status" style="margin-top:8px"></div>
          <div id="social-results"></div>
        </div>
      </div>

      <div class="fbg-panel">
        <div class="fbg-header">
          📘 Facebook Groups Posts
          <em>UK Groups &amp; Deal Community</em>
        </div>
        <div class="fbg-body">
          <button class="fbg-generate-btn" id="fbg-gen-btn" onclick="generateFbGroupsPosts()">
            <span class="btn-spinner"></span>
            <span class="btn-label">${hasFbGroupsPosts ? '🔄 Regenerate' : '📘 Generate FB Groups Posts'}</span>
          </button>
          <div id="fbg-gen-status" class="fbg-gen-status"></div>
          <div class="fbg-posts">
            <div class="fbg-post-card">
              <div class="fbg-post-card-header">🇬🇧 UK Groups</div>
              <div class="fbg-post-text" id="val-fbgroupspost">${fbGroupsPost ? escHtml(fbGroupsPost) : '<span class="empty">(not generated yet)</span>'}</div>
              <div class="fbg-post-actions">
                <button class="social-btn social-btn-copy" onclick="copyFbGroupsPost(this, 'fb_groups_post')">📋 Copy</button>
                <button class="field-edit-btn" onclick="startEdit('fb_groups_post')">Edit</button>
                <button class="fbg-mark-btn${fbGroupsPosted ? ' fbg-posted' : ''}" id="fbg-mark-uk"
                  onclick="markFbGroupsPosted('fb_groups_posted')">${fbGroupsPosted ? `✓ Posted ${escHtml(fbGroupsPosted)}` : 'Mark Posted'}</button>
                <span class="fbg-post-status" id="fbg-status-uk"></span>
              </div>
            </div>
            <div class="fbg-post-card">
              <div class="fbg-post-card-header">📍 Deal Groups</div>
              <div class="fbg-post-text" id="val-fbgroupsdealpost">${fbGroupsDealPost ? escHtml(fbGroupsDealPost) : '<span class="empty">(not generated yet)</span>'}</div>
              <div class="fbg-post-actions">
                <button class="social-btn social-btn-copy" onclick="copyFbGroupsPost(this, 'fb_groups_deal_post')">📋 Copy</button>
                <button class="field-edit-btn" onclick="startEdit('fb_groups_deal_post')">Edit</button>
                <button class="fbg-mark-btn${fbGroupsDealPosted ? ' fbg-posted' : ''}" id="fbg-mark-deal"
                  onclick="markFbGroupsPosted('fb_groups_deal_posted')">${fbGroupsDealPosted ? `✓ Posted ${escHtml(fbGroupsDealPosted)}` : 'Mark Posted'}</button>
                <span class="fbg-post-status" id="fbg-status-deal"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="reel-panel">
        <div class="reel-header">
          🎬 Video Reel
          <em>ElevenLabs + FFmpeg</em>
        </div>
        <div class="reel-body">
          ${reelStatus}
          <label style="font-size:0.78rem;font-weight:600;color:var(--text-soft);
                        text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:5px">
            Occasion (optional)
          </label>
          <select id="reel-occasion-select"
            style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;
                   font-family:'DM Sans',sans-serif;font-size:0.88rem;background:var(--bg-muted);
                   color:var(--text);margin-bottom:10px">
            <option value="">— None —</option>
            <option value="Father's Day">Father's Day</option>
            <option value="Mother's Day">Mother's Day</option>
            <option value="Birthday">Birthday</option>
            <option value="Christmas">Christmas</option>
            <option value="Valentine's Day">Valentine's Day</option>
            <option value="Easter">Easter</option>
            <option value="Teacher gift">Teacher gift</option>
            <option value="End of school year">End of school year</option>
            <option value="Wedding or anniversary">Wedding or anniversary</option>
            <option value="New baby">New baby</option>
            <option value="Retirement">Retirement</option>
            <option value="Thank you gift">Thank you gift</option>
          </select>
          <button class="social-generate-btn" id="reel-gen-btn-${productId}"
            onclick="openReelStudio()">
            <span class="btn-label">${reelLabel}</span>
          </button>
        </div>
      </div>

      <div class="stripe-panel">
        <div class="stripe-header">
          💳 Stripe
          <em>Payment links</em>
        </div>
        <div class="stripe-body">
          ${p.stripe_payment_link
            ? `<div class="stripe-active">
                 <span class="stripe-ok">✓ Stripe link active</span>
                 <span class="stripe-url">${escHtml(p.stripe_payment_link)}</span>
               </div>
               <button class="stripe-btn" id="stripe-btn" onclick="createStripeLink()">
                 <span class="stripe-btn-spinner"></span>
                 <span class="stripe-btn-label">🔄 Recreate</span>
               </button>`
            : `<button class="stripe-btn" id="stripe-btn" onclick="createStripeLink()">
                 <span class="stripe-btn-spinner"></span>
                 <span class="stripe-btn-label">💳 Create Stripe Link</span>
               </button>`
          }
          <div id="stripe-status" class="stripe-status"></div>
        </div>
      </div>

      <div class="imgurl-panel">
        <div class="imgurl-header">
          Hero Image (filename only, e.g. bee-kind-bookmark.jpg)
          <em>Also used for Clear finish</em>
        </div>
        <div class="imgurl-body">
          <div class="imgurl-current" id="imgurl-current">
            ${renderImgCurrent(p['Image URL'])}
          </div>
          <div class="imgurl-input-row">
            <input id="imgurl-input" class="imgurl-input" type="text"
              placeholder="e.g. bee-kind-bookmark.jpg"
              value="${escAttr(p['Image URL'] || '')}"
              onkeydown="if(event.key==='Enter') saveImageUrl()" />
            <button id="imgurl-save" class="imgurl-save" onclick="saveImageUrl()">Save</button>
          </div>
          <div id="imgurl-status" class="imgurl-status"></div>
        </div>
      </div>

      <div class="generated-at">Generated at: ${escHtml(p['Generated At']||'—')}</div>
      <button class="delete-product-btn" onclick="deleteProduct()">🗑 Delete this product</button>
    `;

    if (generatedPosts && Object.keys(generatedPosts).length > 0) {
      renderSocialResults(p);
    }
  }

  function startEditPersonalised() {
    const valDiv = document.getElementById('val-personalised');
    if (!valDiv) return;
    const currentVal = products[current].personalised === 1 ? '1' : '0';
    valDiv.innerHTML = `
      <select class="field-edit-select" id="edit-personalised">
        <option value="0" ${currentVal === '0' ? 'selected' : ''}>No</option>
        <option value="1" ${currentVal === '1' ? 'selected' : ''}>Yes (+£1.50)</option>
      </select>
      <div class="field-edit-actions">
        <button class="field-save-btn" onclick="savePersonalisedField()">Save</button>
        <button class="field-cancel-btn" onclick="cancelEditPersonalised()">Cancel</button>
      </div>
      <div class="field-save-status" id="status-personalised"></div>
    `;
  }

  async function savePersonalisedField() {
    const select = document.getElementById('edit-personalised');
    const statusEl = document.getElementById('status-personalised');
    if (!select) return;
    const newValue = parseInt(select.value, 10);
    const productId = products[current]['Product ID'];
    statusEl.textContent = 'Saving…';
    statusEl.className = 'field-save-status';
    try {
      const res = await fetch(
        `https://craftsbyjon.co.uk/n8n-proxy/products-api/products/${productId}`,
        { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ personalised: newValue }) }
      );
      if (!res.ok) throw new Error(`API returned ${res.status}`);
      products[current].personalised = newValue;
      statusEl.textContent = '✓ Saved';
      statusEl.className = 'field-save-status ok';
      setTimeout(() => {
        const valDiv = document.getElementById('val-personalised');
        if (valDiv) valDiv.innerHTML = newValue === 1 ? 'Yes (+£1.50)' : 'No';
        const noteRow = document.getElementById('row-personalisationnote');
        if (newValue === 1 && !noteRow) {
          const persRow = document.getElementById('row-personalised');
          if (persRow) {
            persRow.insertAdjacentHTML('afterend',
              `<div class="field-row" id="row-personalisationnote">
                <div class="field-label">Personalisation note</div>
                <div class="field-value empty" id="val-personalisationnote">(empty)</div>
                <div class="field-copy">
                  <button class="copy-btn" data-copy="" onclick="copyField(this)" disabled>Copy</button>
                  <button class="field-edit-btn" onclick="startEdit('personalisation_note')">Edit</button>
                </div>
              </div>`
            );
          }
        } else if (newValue === 0 && noteRow) {
          noteRow.remove();
        }
      }, 800);
    } catch (err) {
      statusEl.textContent = '⚠ Failed: ' + err.message;
      statusEl.className = 'field-save-status error';
    }
  }

  function cancelEditPersonalised() {
    const valDiv = document.getElementById('val-personalised');
    if (!valDiv) return;
    valDiv.innerHTML = products[current].personalised === 1 ? 'Yes (+£1.50)' : 'No';
  }

  async function createStripeLink() {
    const p = products[current];
    const productId = p['Product ID'];
    const btn = document.getElementById('stripe-btn');
    const statusEl = document.getElementById('stripe-status');
    btn.disabled = true;
    btn.classList.add('loading');
    if (statusEl) statusEl.textContent = '';
    try {
      const res = await fetch(
        `https://craftsbyjon.co.uk/n8n-proxy/products-api/products/${productId}/create-stripe-link`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' } }
      );
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      products[current].stripe_payment_link = data.stripe_payment_link;
      render();
    } catch (e) {
      btn.disabled = false;
      btn.classList.remove('loading');
      if (statusEl) { statusEl.className = 'stripe-status error'; statusEl.textContent = 'Error: ' + e.message; }
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
</script>
<script src="/staff/nav.js"></script>
</body>
</html>
