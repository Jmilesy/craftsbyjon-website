<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafts by Jon - Staff Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles & Variables */
        :root {
            --color-primary: #E0F7FA; /* Light Cyan/Teal background */
            --color-secondary: #4A4A4A; /* Dark Grey for text */
            --color-accent: #FF7F50; /* Coral accent */
            --color-highlight: #20B2AA; /* Light Sea Green/Teal */
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'DM Sans', sans-serif;
            --transition-speed: 0.6s;
        }

        body {
            margin: 0;
            font-family: var(--font-body);
            color: var(--color-secondary);
            line-height: 1.6;
            padding: 30px;
            background-color: var(--color-primary);
        }

        h1, h2 {
            font-family: var(--font-heading);
            color: var(--color-secondary);
            text-align: center;
            margin-bottom: 1rem;
        }

        p {
            margin-bottom: 1rem;
        }

        a {
            color: var(--color-accent); /* Use accent for links */
            text-decoration: none;
            transition: color var(--transition-speed) ease;
        }

        a:hover {
            color: var(--color-highlight); /* Highlight on hover */
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: #FFF;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        /* Staff Dashboard Specific Styling */
        .dashboard-content {
            text-align: center;
        }
        .dashboard-content h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: var(--color-highlight);
        }
        .dashboard-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }
        .dashboard-links a {
            display: inline-block;
            background-color: var(--color-accent);
            color: var(--color-primary);
            padding: 15px 30px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 1.2rem;
            transition: background-color var(--transition-speed) ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .dashboard-links a:hover {
            background-color: var(--color-highlight);
            text-decoration: none;
        }

        /* Footer */
        footer {
            background-color: var(--color-secondary);
            color: var(--color-primary);
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
        }
        footer a {
            color: var(--color-primary);
            text-decoration: underline;
        }
        footer a:hover {
            color: var(--color-accent);
        }
        footer p {
            margin: 0;
            font-size: 0.9rem;
        }

        /* Responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .dashboard-content h2 {
                font-size: 2rem;
            }
            .dashboard-links a {
                font-size: 1.1rem;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Crafts by Jon</div>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/#products">Products</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#contact">Contact</a></li>
                <li><a href="https://mademe.co.uk/shop/crafts-by-jon/" target="_blank" class="button">Shop Now</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="dashboard-content">
            <h2>Staff Dashboard</h2>
            <p>Welcome to the staff area. Here you can access important resources and tools.</p>
            <div class="dashboard-links">
                <a href="/staff/staff-dashboard.html">Staff Dashboard</a>
                <a href="/staff/staff-management.html">Staff Management</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Crafts by Jon. All rights reserved.</p>
        <p><a href="/privacy.html">Privacy Policy</a></p>
        <p><a href="/staff/staff-dashboard.html">Staff Dashboard</a></p>
        <p><a href="/staff/staff-management.html">Staff Management</a></p>
    </footer>

    <script>
        // Smooth scrolling for anchor links (if any were needed, not applicable here)
    </script>
</body>
</html>
