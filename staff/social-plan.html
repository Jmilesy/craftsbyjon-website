<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social approval | Crafts by Jon</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#203039;font:16px system-ui,sans-serif}main{max-width:1100px;margin:32px auto;padding:0 18px}h1{font-size:2rem;margin-bottom:8px}p{line-height:1.5}header p{color:#53616a;max-width:760px}.toolbar{display:flex;gap:12px;align-items:center;margin:24px 0;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #aebcc3;border-radius:7px;padding:10px}button{cursor:pointer;background:white;color:#203039}button.primary{background:#137f79;border-color:#137f79;color:white}button.danger{color:#a32020}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #dce3e7;border-radius:12px;padding:20px;margin:18px 0;box-shadow:0 3px 12px #20303908}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{font-size:.85rem;padding:5px 10px;border-radius:20px;background:#edf0f2}.approved{background:#def2e9}.needs_check,.external_hold{background:#ffe4c7}.published{background:#dcedfb}.layout{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:24px;margin-top:18px}.media{width:100%;max-height:380px;object-fit:contain;background:#eef1f3;border-radius:8px}.textonly{padding:40px 20px;background:#eef1f3;border-radius:8px;color:#53616a;text-align:center}label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 6px}textarea,input{width:100%;background:#fff;color:#203039}textarea{min-height:150px;line-height:1.5;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.note{font-size:.88rem;color:#53616a}.error{color:#a32020;white-space:pre-wrap}#notice{padding:12px 0}a{color:#116e93}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.message{padding:12px;background:#fff3d5;border-radius:8px}small{display:block;margin-top:10px}@media(max-width:650px){.layout,.grid{grid-template-columns:1fr}.media{max-height:280px}.top{align-items:flex-start}main{margin-top:22px}.card{padding:16px}}
</style></head><body><script src="/staff/nav.js"></script><main>
<header><h1>Review your social posts</h1><p>Check the exact copy, media and time. Nothing in this queue publishes until you approve it. Editing a post removes its approval.</p></header>
<div class="toolbar"><label for="filter">Show</label><select id="filter"><option value="review">Awaiting review</option><option value="approved">Approved</option><option value="published">Published</option><option value="all">All posts</option></select><button id="refresh">Refresh</button><span id="count"></span></div>
<div id="notice" role="status" aria-live="polite">Loading your queue…</div><section id="queue"></section>
</main><script>
const base='/n8n-proxy/products-api/weekly-plan', list=document.querySelector('#queue'), notice=document.querySelector('#notice');let rows=[],ready=false;
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
async function api(path,body){const r=await fetch(base+path,{credentials:'same-origin',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});let d;try{d=await r.json();}catch{throw Error('Could not read the server response. Please sign in and refresh.');}if(!r.ok)throw Error(d.error||'Request failed');return d;}
function input(label,value,type='text'){const wrap=el('div'),id='field-'+Math.random().toString(36).slice(2),l=el('label',label);l.htmlFor=id;const f=el(type==='textarea'?'textarea':'input');f.id=id;if(type!=='textarea')f.type=type;f.value=value||'';wrap.append(l,f);return {wrap,f};}
function localTime(iso){const d=new Date(iso);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function render(){
 list.replaceChildren();const filter=document.querySelector('#filter').value;
 const visible=rows.filter(r=>filter==='all'||(filter==='review'?['draft','needs_check','external_hold'].includes(r.status):r.status===filter));
 document.querySelector('#count').textContent=visible.length+' posts';
 if(!visible.length)list.append(el('p','No posts in this view.'));
 for(const row of visible){
  const p=row.payload,card=el('article',undefined,'card'),top=el('div',undefined,'top');
  top.append(el('strong',row.platform.charAt(0).toUpperCase()+row.platform.slice(1)+' · '+row.plan_date),el('span',({draft:'Awaiting approval',approved:'Approved',published:'Published',rejected:'Rejected',needs_check:'Needs checking',external_hold:'Held during cutover',publishing:'Publishing'})[row.status]||row.status,'badge '+row.status));card.append(top);if(p.product_id)card.append(el('p','Product: '+p.product_id,'note'));
  const layout=el('div',undefined,'layout'),media=el('div'),form=el('div');
  if(p.media_url){const m=el(p.media_type==='reel'?'video':'img');m.src=p.media_url;m.className='media';if(m.tagName==='VIDEO'){m.controls=true;m.preload='metadata';if(p.thumbnail_url)m.poster=p.thumbnail_url;}else m.alt='Exact media for this post';media.append(m,el('small','This copy of the media is preserved for review.','note'));}
  else media.append(el('div','Text-only post','textonly'));
  const text=input('Caption',p.text,'textarea'),title=input('Title (Pinterest)',p.title),link=input(row.platform==='facebook'?'First-comment link':row.platform==='pinterest'?'Destination link':'Reference link (not added to Instagram)',p.link,'url'),when=input('Publish time · '+Intl.DateTimeFormat().resolvedOptions().timeZone,localTime(p.scheduled_at),'datetime-local'),url=input('Media URL',p.media_url,'url');
  form.append(text.wrap);if(row.platform==='pinterest')form.append(title.wrap);form.append(link.wrap,when.wrap,url.wrap);
  const locked=['publishing','published','needs_check','external_hold'].includes(row.status);const fields=[text.f,title.f,link.f,when.f,url.f];for(const f of fields)f.disabled=locked;
  const status=el('div','','error'),actions=el('div',undefined,'actions'),save=el('button','Save changes'),approve=el('button','Approve this version','primary'),reject=el('button','Reject','danger');
  save.disabled=true;approve.disabled=locked||!ready||row.status==='approved';reject.disabled=locked||!ready||row.status==='rejected';
  for(const f of fields)f.addEventListener('input',()=>{save.disabled=locked||!ready;approve.disabled=true;reject.disabled=true;status.textContent='Save changes, then review the saved version before approving.';});
  async function act(action,changes){for(const b of [save,approve,reject])b.disabled=true;status.textContent='Saving…';try{await api('/review/'+row.id+'/'+action,{revision:row.revision,...(changes?{changes}:{})});await load();}catch(e){status.textContent=e.message;save.disabled=locked||!ready;reject.disabled=locked||!ready;}}
  save.onclick=()=>{if(!when.f.value){status.textContent='Choose a publishing time';return;}act('edit',{text:text.f.value,title:title.f.value,link:link.f.value,media_url:url.f.value,thumbnail_url:url.f.value===p.media_url?p.thumbnail_url:'',media_type:url.f.value.toLowerCase().split('?')[0].endsWith('.mp4')?'reel':'image',scheduled_at:new Date(when.f.value).toISOString()});};
  approve.onclick=()=>act('approve');reject.onclick=()=>act('reject');actions.append(save,approve,reject);
  form.append(el('p','Approval covers this platform, exact copy, media, link and time. Times are shown in your browser’s timezone.','note'),actions,status);
  if(row.error)form.append(el('p',row.error,'message'));
  if(row.status==='needs_check')form.append(el('p','This item will not retry automatically. Check the platform before any replacement is created.','note'));
  if(row.approved_at)form.append(el('p','Approved by '+row.approved_by+' · '+new Date(row.approved_at).toLocaleString(),'note'));
  if(row.platform_id)form.append(el('p','Confirmed platform ID: '+row.platform_id,'note'));
  layout.append(media,form);card.append(layout);list.append(card);
 }
}
async function load(){try{const d=await api('/review');rows=d.items;ready=d.ready;notice.textContent=ready?'Only approved posts are scheduled for delivery.':'Cutover is not complete. All approval actions and queue delivery are held.';render();}catch(e){notice.textContent=e.message;}}
document.querySelector('#filter').onchange=render;document.querySelector('#refresh').onclick=load;load();
</script></body></html>
