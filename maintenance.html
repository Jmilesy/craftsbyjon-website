<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Back in a moment — Crafts by Jon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4f8ff;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #4A90E2;
      color: #fff;
      padding: 28px 24px;
      text-align: center;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .box {
      background: #fff;
      border: 2px solid #d0e4f7;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #d0e4f7;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .box h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 16px;
    }
    .box p {
      font-size: 1rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .box a {
      color: #4A90E2;
      text-decoration: none;
    }
    .box a:hover { text-decoration: underline; }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Crafts by Jon</h1>
  </header>
  <main>
    <div class="box">
      <h2>Back in a moment</h2>
      <p>We're making some improvements to the store. We'll be back shortly.</p>
      <p>In the meantime, feel free to get in touch:<br>
        <a href="mailto:jon@craftsbyjon.co.uk">jon@craftsbyjon.co.uk</a>
      </p>
    </div>
  </main>
  <footer>&copy; 2026 Crafts by Jon</footer>
</body>
</html>
